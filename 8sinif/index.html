<style>
:root{--mor:#7c4dff;--not:#fff6d1;--notsinir:#efd57a;--bg:#f4f6fb;--kart:#fff;--yazi:#1d2433;--soluk:#667085;--ana:#dc2626;--yesil:#22a06b;--kirmizi:#e5484d;--sinir:#e4e7ec}
@media (prefers-color-scheme:dark){:root{--not:#2a2614;--notsinir:#5c4e1e;--bg:#12151c;--kart:#1c212b;--yazi:#eef1f6;--soluk:#98a2b3;--sinir:#2c3340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--kart);border-bottom:1px solid var(--sinir);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;flex:1}
main{max-width:900px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:none;border-radius:14px}
.geri{background:var(--bg);color:var(--yazi);padding:10px 16px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.kart{background:var(--kart);border:1px solid var(--sinir);border-radius:18px;padding:18px;text-align:left;color:var(--yazi);width:100%}
.ders{min-height:130px;display:flex;flex-direction:column;justify-content:space-between;border-left:8px solid var(--renk,var(--ana))}
.ders .ikon{font-size:38px}.ders b{font-size:20px}
.pasif{opacity:.5}
.liste .kart{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rozet{font-size:14px;color:var(--soluk);white-space:nowrap}
.anlatim p{background:var(--kart);border:1px solid var(--sinir);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.btn{background:var(--ana);color:#fff;padding:16px 22px;font-weight:600;font-size:19px}
.btn2{background:var(--kart);color:var(--yazi);border:1px solid var(--sinir);padding:16px 22px;font-size:19px}
.satir{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.secenek{display:block;width:100%;text-align:left;background:var(--kart);border:2px solid var(--sinir);padding:16px 18px;margin-bottom:10px;font-size:19px;color:var(--yazi)}
.secenek.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 14%,var(--kart))}
.secenek.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 14%,var(--kart))}
.soru{font-size:21px;font-weight:600;margin:6px 0 16px}
.cozum{border-radius:14px;padding:14px 16px;margin-top:6px;background:var(--kart);border:1px solid var(--sinir)}
.ilerleme{height:10px;background:var(--sinir);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.ilerleme div{height:100%;background:var(--ana)}
.ozet{font-size:44px;font-weight:700;text-align:center;margin:20px 0 4px}
.not{color:var(--soluk);font-size:15px}
h2{margin:6px 0 14px}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin-bottom:6px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:var(--ana)}
main.genis{max-width:1180px}
.konu-duzen{display:grid;gap:0 28px;grid-template-areas:"a" "o" "v" "b"}
.konu-a{grid-area:a}.konu-v{grid-area:v}.konu-b{grid-area:b}
.ozet-not{grid-area:o;background:var(--not);border:1px solid var(--notsinir);border-radius:18px;padding:16px 20px;margin:4px 0 18px}
.ozet-not h3{margin:0 0 8px;font-size:20px}
.ozet-not ul{margin:0;padding-left:20px}.ozet-not li{margin:7px 0}
@media (min-width:960px){.konu-duzen{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"a o" "v o" "b o"}.ozet-not{position:sticky;top:78px;align-self:start;margin-top:48px}}
.btn3{background:var(--kart);color:var(--ana);border:2px solid var(--ana);padding:14px 20px;font-size:18px;font-weight:600;width:100%;margin-bottom:14px}
.ek-satir{margin-top:10px;padding-top:10px;border-top:1px dashed var(--sinir)}
.ses-btn{background:var(--bg);color:var(--yazi);border:1px solid var(--sinir);padding:6px 12px;font-size:16px;border-radius:10px}
.ing{font-family:"Segoe UI",system-ui,sans-serif;color:var(--mor)}
.kelime-cip{display:inline-block;background:var(--bg);border:1px solid var(--sinir);border-radius:10px;padding:3px 10px;margin:4px 4px 0 0;font-size:16px}
.oyun-btn{background:var(--mor)}
.oyun-mod{min-height:140px;display:flex;flex-direction:column;gap:6px;border-left:8px solid var(--mor)}
.oyun-mod .ikon{font-size:36px}
.oyun-mod .rozet{white-space:normal;line-height:1.35}
.yukle-btn{background:var(--ana);color:#fff;padding:9px 14px;font-size:16px;font-weight:600}
/* Sesli anlatım */
.anlatim-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#1f6f50,#2a8a63);color:#fff;padding:16px 18px;margin:8px 0 18px;font-size:19px}
.anlatim-btn small{opacity:.85;font-size:15px}.anlatim-ikon{font-size:36px}
.tahta-kap{max-width:980px;margin:0 auto}
.tahta{position:relative;min-height:440px;background:#24493b;background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.06),transparent 60%);border:12px solid #8a5a35;border-radius:14px;padding:22px 28px;color:#f4f1e8;box-shadow:inset 0 0 40px rgba(0,0,0,.35);font-family:"Segoe Print","Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
.tahta.son{background:#1d4e74}
.tahta-baslik{font-size:30px;font-weight:700;color:#ffe08a;border-bottom:2px dashed rgba(255,255,255,.25);padding-bottom:10px;margin-bottom:14px}
.tahta-satir{font-size:23px;line-height:1.5;margin:0 0 10px}
.tahta-satir.yaziliyor{animation:tahtaYaz 1.1s steps(28,end)}
@keyframes tahtaYaz{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.vurgu{background:rgba(255,224,138,.28);color:#ffe08a;border-radius:6px;padding:0 6px;font-weight:700}
.tahta-gorsel{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.nokta-izgara{display:grid;gap:14px;padding:8px}
.nokta{width:30px;height:30px;border-radius:50%;background:#ffb3c7;box-shadow:0 0 0 3px rgba(255,255,255,.25);animation:belir .3s ease-out}
.sayi-dizisi{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.sayi-cip{min-width:54px;text-align:center;font-size:26px;font-weight:700;padding:8px 14px;border:3px solid #ffe08a;border-radius:14px;color:#ffe08a;animation:belir .35s ease-out}
@keyframes belir{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.dusun{font-size:44px}
.tahta-cubuk{height:8px;background:var(--sinir);border-radius:99px;overflow:hidden;margin:12px 0}
.tahta-cubuk div{height:100%;background:var(--yesil);transition:width .3s}
.oynatici{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.oynatici .bosluk{flex:1}
.oynatici .ses-btn{font-size:18px;padding:10px 14px}
@media (max-width:600px){.tahta{padding:16px;border-width:8px;min-height:380px}.tahta-satir{font-size:19px}.tahta-baslik{font-size:24px}}
/* Günlük hedef */
.hedef-kart{background:var(--kart);border:1px solid var(--sinir);border-radius:18px;padding:16px 18px;margin-bottom:22px;display:grid;gap:10px}
.hedef-kart.tamam{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,var(--kart))}
.hedef-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:19px}
.seri{background:color-mix(in srgb,#f59e0b 16%,var(--kart));border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
.hedef-satir{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:10px;font-size:16px}
.hedef-satir b{text-align:right}
.cubuk{height:14px;background:var(--sinir);border-radius:999px;overflow:hidden}
.cubuk div{height:100%;background:var(--ana);border-radius:999px;transition:width .4s}
.hedef-kart.tamam .cubuk div{background:var(--yesil)}
.hedef-alt{color:var(--soluk);font-size:15px}
.hedef-kart .btn2{justify-self:start;padding:10px 16px;font-size:17px}
@media (max-width:560px){.hedef-satir{grid-template-columns:1fr 64px}.hedef-satir span{grid-column:1/-1}}
.kutlama{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--yesil);color:#fff;padding:16px 26px;border-radius:18px;font-size:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:20;transition:opacity .6s,transform .6s}
.kutlama.gizle{opacity:0;transform:translate(-50%,-14px)}
/* İlerleme paneli */
.karolar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.karo{background:var(--kart);border:1px solid var(--sinir);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.karo span{color:var(--soluk);font-size:14px}.karo b{font-size:24px}
.grafik-kart{background:var(--kart);border:1px solid var(--sinir);border-radius:18px;padding:16px 18px;margin-bottom:22px}
.grafik-baslik{color:var(--soluk);font-size:14px;margin-bottom:10px}
.grafik{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end}
.gun{display:flex;flex-direction:column;align-items:center;gap:4px;outline:none}
.gun-deger{font-size:14px;color:var(--soluk);height:18px}
.gun-alan{position:relative;width:100%;height:140px;border-bottom:1px solid var(--sinir);display:flex;align-items:flex-end;justify-content:center}
.gun-bar{width:min(36px,70%);background:var(--ana);border-radius:4px 4px 0 0;min-height:0;transition:filter .15s}
.gun-bar.tamam{background:var(--yesil)}
.gun:hover .gun-bar,.gun:focus .gun-bar{filter:brightness(1.12)}
.hedef-iz{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--soluk) 60%,transparent);pointer-events:none}
.gun-ad{font-size:13px;color:var(--soluk);white-space:nowrap}
.ders-satir{display:grid;grid-template-columns:170px 1fr 250px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--sinir)}
.ders-satir:last-child{border-bottom:0}
.ders-ad{font-weight:600}.ders-bilgi{color:var(--soluk);font-size:14px;text-align:right}
.ders-cubuk{height:12px;background:var(--sinir);border-radius:999px;overflow:hidden}.ders-cubuk div{height:100%;border-radius:999px}
@media (max-width:700px){.ders-satir{grid-template-columns:1fr}.ders-bilgi{text-align:left}}
.iki-sutun{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.iki-sutun{grid-template-columns:1fr}}
.konu-satir{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.yuzde{font-weight:700;font-size:20px;border-radius:10px;padding:4px 10px}
.yuzde.dusuk{color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,var(--kart))}
.yuzde.orta{color:#b45309;background:color-mix(in srgb,#f59e0b 14%,var(--kart))}
.yuzde.yuksek{color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,var(--kart))}
.secim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px}
.secim>span{min-width:190px;font-weight:600}
.cip{background:var(--bg);color:var(--yazi);border:2px solid var(--sinir);padding:8px 18px;font-size:17px;border-radius:999px}
.cip.secili{border-color:var(--ana);background:color-mix(in srgb,var(--ana) 14%,var(--kart));font-weight:700}
.oyun-izgara{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.oyun-izgara>div{display:flex;flex-direction:column;gap:10px}
.oyun-kart{background:var(--kart);border:2px solid var(--sinir);padding:16px 12px;font-size:19px;color:var(--yazi);transition:all .2s;min-height:60px}
.oyun-kart.secili{border-color:var(--mor);background:color-mix(in srgb,var(--mor) 14%,var(--kart))}
.oyun-kart.eslesti{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 16%,var(--kart));opacity:.55}
.oyun-kart.hatali{border-color:var(--kirmizi)}
.salla{animation:salla .4s}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.oyun-ust{display:flex;justify-content:space-between;gap:10px;background:var(--kart);border:1px solid var(--sinir);border-radius:14px;padding:12px 16px;font-size:18px}
.hizli-kelime{font-size:40px;font-weight:700;text-align:center;margin:26px 0 6px}
.cevir-kart{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:240px;margin:14px 0;background:var(--kart);border:2px solid var(--mor);font-size:40px;font-weight:700;color:var(--yazi)}
.cevir-kart small{font-size:16px;font-weight:400;color:var(--soluk)}
.cevir-kart.acik{background:color-mix(in srgb,var(--mor) 12%,var(--kart))}
</style>

#secmeliBolum .bolum-baslik{margin:26px 0 12px}

<style id="konu-ek">.ornekler{display:grid;gap:8px;margin-bottom:12px}.ornek{background:var(--kart);border:1px solid var(--sinir);border-left:5px solid var(--ana);border-radius:12px;padding:10px 14px}.ornek summary{cursor:pointer;line-height:1.5}.ornek .cozum-ic{margin-top:8px;padding-top:8px;border-top:1px dashed var(--sinir);line-height:1.55}.hatalar{background:color-mix(in srgb,#f59e0b 10%,var(--kart));border:1px solid color-mix(in srgb,#f59e0b 45%,var(--sinir));border-radius:14px;padding:10px 16px;margin:4px 0 12px}.hatalar h3{margin:0 0 4px;font-size:17px}.hatalar ul{margin:0;padding-left:20px}.video-ara{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#dc2626,#ea580c);color:#fff;text-decoration:none;border-radius:14px;padding:12px 16px}.video-ara>span:first-child{font-size:28px}.video-ara small{display:block;opacity:.92;font-size:13px;margin-top:2px}</style>

.pn-kutular span{font-size:15px;color:var(--soluk)}.pn-kutular b{font-size:30px;line-height:1.2}.pn-kutular small{font-size:13.5px;color:var(--soluk)}
.pn-fark.art{color:#16a34a!important}.pn-fark.az{color:#dc2626!important}

.pn-ad{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:18px;flex-wrap:wrap}.pn-ad small{font-size:15px;color:var(--soluk)}

.pn-git{font-weight:700;color:var(--ana);white-space:nowrap}

.pn-cipler{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.pn-cip{background:color-mix(in srgb,#16a34a 12%,var(--kart));border:1px solid color-mix(in srgb,#16a34a 40%,var(--sinir));border-radius:999px;padding:6px 12px;font-size:16px}

git(anaSayfa, SINIF.baslik, false);
// Tablete uygulama olarak kurulabilme ve internetsiz çalışma
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
let kurulumIstegi = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); kurulumIstegi = e; document.getElementById("yukle").hidden = false; });
document.getElementById("yukle").onclick = async () => { if (!kurulumIstegi) return; kurulumIstegi.prompt(); await kurulumIstegi.userChoice; kurulumIstegi = null; document.getElementById("yukle").hidden = true; };
window.addEventListener("appinstalled", () => { document.getElementById("yukle").hidden = true; });
</script>

<script src="yedek.js"></script>
