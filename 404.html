<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyunla Öğren</title>
<script>
// Yanlış yazılan adresleri düzelt: büyük harf, "sınıf", "1.sinif", "1-sinif", eksik "/" vb.
(function () {
  var p = decodeURIComponent(location.pathname).toLocaleLowerCase("tr");
  var y = p.replace(/ı/g, "i").replace(/ş/g, "s").replace(/(\d)[\.\-_ ]+sinif/g, "$1sinif").replace(/sinifi?(?=\/|$)/g, "sinif");
  var m = y.match(/\/6sinif\/(\d)\s*sinif/) || y.match(/\/6sinif\/(\d)\/?$/);
  var hedef = null;
  if (m && "123457".indexOf(m[1]) >= 0) hedef = "/6sinif/" + m[1] + "sinif/";
  else if (/\/6sinif\/(minik|kres|anaokul|okul ?oncesi|4-5|0sinif)/.test(y)) hedef = "/6sinif/minik/";
  else if (/^\/6sinif\/?(6sinif)?\/?$/.test(y)) hedef = "/6sinif/";
  if (hedef && hedef !== location.pathname) location.replace(hedef);
})();
</script>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fff8ec;color:#2b2b2b;display:flex;flex-direction:column;align-items:center;padding:32px 16px;text-align:center}
h1{margin:0 0 6px}p{color:#666;margin:0 0 20px}
a{display:flex;align-items:center;gap:14px;width:min(420px,100%);box-sizing:border-box;margin:8px 0;padding:18px 20px;border-radius:18px;color:#fff;text-decoration:none;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15)}
a span{font-size:34px}</style></head><body>

<a href="/6sinif/1sinif/" style="background:#2fb36b"><span>🐣</span>1. Sınıf</a>
<a href="/6sinif/2sinif/" style="background:#9b5de5"><span>🎈</span>2. Sınıf</a>
<a href="/6sinif/3sinif/" style="background:#f2a900"><span>🚀</span>3. Sınıf</a>
<a href="/6sinif/4sinif/" style="background:#3d8bff"><span>🔭</span>4. Sınıf</a>
<a href="/6sinif/5sinif/" style="background:#0ea5a4"><span>🧭</span>5. Sınıf</a>

</body></html>
