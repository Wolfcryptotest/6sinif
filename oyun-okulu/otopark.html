<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Otopark Kaçışı</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc83d;--green1:#5ee36b;--green2:#1fa64a;--panel1:#34405e;--panel2:#232b40}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Baloo 2",system-ui,sans-serif;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#2c3754 0%,#151a27 55%,#0b0d14 100%)}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;background:none}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em}
.sk{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;z-index:6}
.pill{display:flex;align-items:center;gap:6px;background:#0009;border:2px solid #ffffff1a;border-radius:22px;padding:3px 14px 3px 5px;font-weight:800;font-size:18px;backdrop-filter:blur(6px)}
.pill .i{font-size:26px}
#coinBox.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
.iconbtn{width:44px;height:44px;border-radius:14px;background:linear-gradient(#3b4664,#262e45);box-shadow:0 4px 0 #141927;font-size:22px;display:flex;align-items:center;justify-content:center}
.iconbtn:active,.big:active,.tile:active,.boost:active,.mbtn:active{transform:translateY(3px);box-shadow:none}
#lvlLabel{font-weight:800;font-size:22px;text-shadow:0 2px 0 #0008;text-align:center;line-height:1}
#lvlLabel small{display:block;font-size:11px;letter-spacing:3px;color:var(--gold)}
#lvlLabel.hard small{color:#ff6b6b}
.screen{position:fixed;inset:0;padding-top:62px;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:scrIn .35s ease-out}
@keyframes scrIn{from{opacity:0;transform:scale(1.03)}}
/* HOME */
#home{justify-content:center;gap:12px;padding-bottom:24px;overflow:hidden}
.bgcars{position:absolute;inset:0;pointer-events:none;opacity:.22;overflow:hidden}
.bgcars .bc{position:absolute;left:-140px;width:120px;height:60px;animation:drive linear infinite}
.bgcars .bc.rev{animation-name:driveR}
@keyframes drive{to{transform:translateX(calc(100vw + 280px))}}
@keyframes driveR{from{transform:translateX(calc(100vw + 280px)) scaleX(-1)}to{transform:translateX(0) scaleX(-1)}}
.road{position:absolute;left:0;right:0;height:74px;background:#ffffff06;border-top:2px dashed #ffffff10;border-bottom:2px dashed #ffffff10}
.logo{text-align:center;position:relative}
.logo h1{font-size:46px;line-height:.88;font-weight:800;letter-spacing:1px;
  background:linear-gradient(#fff6c2,#ffb703 60%,#fb8500);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #7a3b00) drop-shadow(0 10px 12px #0009)}
.logo p{color:#9fb0d0;font-size:13px;letter-spacing:4px;margin-top:4px}
#logoCar{width:230px;height:118px;animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px) rotate(-1deg)}}
.big{position:relative;background:linear-gradient(var(--green1),var(--green2));border-radius:24px;padding:12px 54px 14px;font-size:30px;font-weight:800;
  box-shadow:0 6px 0 #0d6b2c,0 16px 26px #0008;text-shadow:0 2px 0 #0006;animation:breath 1.8s ease-in-out infinite;line-height:1.1}
.big small{display:block;font-size:14px;opacity:.92}
@keyframes breath{50%{transform:scale(1.04)}}
.tiles{display:flex;gap:10px;position:relative}
.tile{position:relative;width:78px;height:80px;border-radius:20px;background:linear-gradient(var(--panel1),var(--panel2));box-shadow:0 5px 0 #121726;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#ffe08a}
.tile span{font-size:12px;margin-top:3px;color:#cfd8ee}
.badge{position:absolute;top:-7px;right:-7px;background:#ef233c;border-radius:12px;min-width:24px;height:24px;font-size:14px;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 0 #8d0b1d;color:#fff;animation:bump 1s infinite}
.chestbar{width:290px;text-align:center;font-size:13px;color:#cfd8ee;position:relative}
.bar{height:14px;border-radius:8px;background:#0008;overflow:hidden;border:2px solid #ffffff14;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9f1c);border-radius:6px;transition:width .5s}
.bar.g i{background:linear-gradient(90deg,#5ee36b,#1fa64a)}
.ver{font-size:11px;color:#5b6787;position:relative}
/* GAME */
#hudRow{width:100%;max-width:540px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px}
#hearts{font-size:26px;white-space:nowrap;display:flex;gap:2px}
#hearts .h{display:inline-block}
#hearts .h.breaking{animation:hbreak .5s forwards}
@keyframes hbreak{30%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(.8);opacity:.5}}
#streak{font-weight:800;color:#ffb703;font-size:15px;white-space:nowrap}
#miniChest{width:92px;flex-shrink:0;font-size:12px;color:#cfd8ee;text-align:right}
#progWrap{width:100%;max-width:540px;padding:6px 14px 0;font-size:12px;color:#9fb0d0;display:flex;align-items:center;gap:8px}
#progWrap .bar{flex:1;margin:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#curb{padding:9px;border-radius:22px;background:repeating-linear-gradient(45deg,#ffcc00 0 14px,#1b1b1b 14px 28px);box-shadow:0 18px 40px #000a,inset 0 0 0 2px #0006;position:relative}
#curb::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 3px 0 #ffffff40,inset 0 -4px 0 #0005;pointer-events:none}
#curb.boss{background:repeating-linear-gradient(45deg,#9b5de5 0 14px,#ffd23f 14px 28px);animation:glowP 1.1s infinite alternate}
@keyframes glowP{to{box-shadow:0 0 44px #9b5de5aa,0 18px 40px #000a}}
#lvlLabel.boss small{color:#c77dff}
#intro.boss h2{color:#e0aaff;text-shadow:0 3px 0 #3c096c,0 0 24px #9b5de5}
.ribbon.bossr{background:linear-gradient(#c77dff,#7b2cbf);color:#fff;box-shadow:0 4px 0 #3c096c}
.lv.bossl{background:linear-gradient(#c77dff,#7b2cbf);box-shadow:0 4px 0 #3c096c}
.moves{color:#e0aaff}.moves.low{color:#ff6b6b;animation:bump .6s infinite}
.cbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 3px 0 #0007,0 0 0 3px #fff;z-index:2}
.lockb{background:#3b4254;color:#fff}.lockb.pop{animation:lpop .4s forwards}
@keyframes lpop{50%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.keyb{background:#fff4c2;animation:kglow 1s infinite alternate}
@keyframes kglow{to{box-shadow:0 3px 0 #0007,0 0 0 3px #fff,0 0 16px 4px #ffd23f}}
.gateb{color:#fff}
.ambb{background:#e63946;color:#fff;font-weight:800}.ambb.low{animation:bump .5s infinite}
.car.locked .rot{filter:grayscale(.75) brightness(.7) drop-shadow(0 5px 3px #000b)}
.gate{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 2px #0009)}
.gate:not(.open){animation:gpulse 1.4s infinite alternate}
@keyframes gpulse{to{filter:drop-shadow(0 0 8px #ffcc00) drop-shadow(0 4px 2px #0009)}}
.gate .arm{transform-origin:20px 50px;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .5s}
.gate.open .arm{transform:rotate(-80deg);opacity:.25}
.walker{position:absolute;pointer-events:none;z-index:3}
.walker .wrot{width:100%;height:100%;transition:transform .2s}
.walker.jump{animation:wjump .45s}
@keyframes wjump{40%{transform:translateY(-14px) scale(1.25)}}
.featic{font-size:90px;margin:6px 0 10px;color:#ffe08a}
#curb.hard{background:repeating-linear-gradient(45deg,#ff3b3b 0 14px,#fff 14px 28px);animation:glowR 1.2s infinite alternate}
@keyframes glowR{to{box-shadow:0 0 40px #ff3b3b88,0 18px 40px #000a}}
#board{position:relative;border-radius:14px;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 20% 30%,#ffffff08 0 2px,transparent 3px) 0 0/23px 23px,
   radial-gradient(circle at 70% 60%,#00000030 0 2px,transparent 3px) 0 0/17px 17px,
   linear-gradient(160deg,#3b404b,#2a2e37 60%,#22252d)}
#lines{position:absolute;inset:0;pointer-events:none;border-radius:14px}
.car{position:absolute;pointer-events:none;will-change:transform}
.car .rot{position:absolute;filter:drop-shadow(0 5px 3px #000b)}
.car.enter{transform:scale(0) !important}
.car svg{overflow:visible;display:block;pointer-events:none}
.beam{opacity:.26;transition:opacity .15s}
.car.go .beam{opacity:.95}
.car.hint .rot{animation:hintp .5s infinite alternate}
@keyframes hintp{to{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 4px #ffd166) brightness(1.25)}}
.car.wob .rot{animation:wob .3s}
@keyframes wob{25%{margin-left:-4px}50%{margin-left:3px}75%{margin-left:-2px}}
.car.tapfx .rot{animation:tapfx .18s}
@keyframes tapfx{50%{transform:var(--rt) scale(1.07)}}
.blinkA{animation:blk .5s infinite steps(1)}.blinkB{animation:blk .5s infinite steps(1) reverse}
@keyframes blk{50%{opacity:.15}}
.cone{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 2px #0009)}
.craneMode .car .rot{animation:pick .6s infinite alternate}
@keyframes pick{to{filter:brightness(1.35) drop-shadow(0 0 8px #5aa9ff)}}
#boosts{display:flex;gap:12px;padding:10px 0 18px}
.boost{position:relative;width:80px;height:68px;border-radius:18px;background:linear-gradient(#3f4b6e,#28304a);box-shadow:0 5px 0 #161b2b;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe08a}
.boost.on{background:linear-gradient(#5aa9ff,#2f6fed);color:#fff}
.boost span{font-size:11px;font-weight:800;color:#ffd166;display:flex;align-items:center;gap:2px}
.boost .cnt{position:absolute;top:-7px;right:-7px;background:#2f80ed;border-radius:10px;font-size:12px;font-style:normal;padding:0 7px;font-weight:800;box-shadow:0 2px 0 #133d7a;color:#fff}
#game.shake{animation:shk .35s}
@keyframes shk{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.float{position:fixed;z-index:21;pointer-events:none;font-weight:800;font-size:20px;color:#ffd166;text-shadow:0 2px 0 #000,0 0 8px #000;animation:flt 1s ease-out forwards;display:flex;align-items:center;gap:2px}
@keyframes flt{to{transform:translateY(-60px);opacity:0}}
.flycoin{position:fixed;z-index:22;font-size:24px;pointer-events:none;transition:transform .6s cubic-bezier(.5,-0.4,.7,1),opacity .6s}
#combo{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:21;pointer-events:none;font-size:46px;font-weight:800;opacity:0;line-height:1;
  background:linear-gradient(#fff,#ffd166 50%,#ff7b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a2e00) drop-shadow(0 0 16px #000)}
#combo.pop{animation:cpop .9s ease-out}
@keyframes cpop{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.25)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#intro{position:fixed;left:0;right:0;top:40%;z-index:25;pointer-events:none;display:flex;justify-content:center}
#intro .card{background:linear-gradient(90deg,transparent,#000c 20%,#000c 80%,transparent);width:100%;text-align:center;padding:12px 0;transform:translateX(-110%)}
#intro .card.show{animation:introS 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes introS{0%{transform:translateX(-110%)}20%,75%{transform:translateX(0)}100%{transform:translateX(110%)}}
#intro h2{font-size:40px;font-weight:800;line-height:1;text-shadow:0 3px 0 #0008}
#intro p{font-size:16px;color:#ffd166}
#intro.hard h2{color:#ff5d5d;text-shadow:0 3px 0 #6b0000,0 0 24px #ff0000}
/* MODAL */
#modal{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mbox{position:relative;width:100%;max-width:380px;max-height:88vh;overflow:auto;background:linear-gradient(#2e3856,#1c2235);border:3px solid #ffffff1f;border-radius:26px;padding:24px 18px 18px;text-align:center;box-shadow:0 20px 60px #000,inset 0 2px 0 #ffffff22;animation:mIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes mIn{from{transform:scale(.6);opacity:0}}
.mbox h2{font-size:28px;font-weight:800;line-height:1.1;margin-bottom:8px;text-shadow:0 3px 0 #0008}
.ribbon{display:inline-block;margin:-6px 0 10px;padding:4px 26px;background:linear-gradient(#ffd166,#f59f00);color:#4a2c00;font-weight:800;border-radius:10px;box-shadow:0 4px 0 #9a6200;font-size:15px;letter-spacing:1px}
.stars{font-size:56px;margin:2px 0 8px;display:flex;justify-content:center;gap:6px}
.stars b{display:inline-block;filter:grayscale(1) brightness(.45);transform:scale(.6);transition:all .35s cubic-bezier(.2,2,.4,1)}
.stars b:nth-child(2){transform:scale(.7) translateY(-10px)}
.stars b.on{filter:none;transform:scale(1)}
.stars b:nth-child(2).on{transform:scale(1.15) translateY(-10px)}
.rows{background:#0005;border-radius:16px;padding:10px 14px;margin:8px 0 12px;text-align:left;font-size:16px}
.rows div{display:flex;justify-content:space-between;align-items:center}
.rows .tot{border-top:2px dashed #ffffff22;margin-top:6px;padding-top:6px;font-size:22px;font-weight:800;color:#ffd166}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border-radius:18px;padding:12px;font-size:20px;font-weight:800;background:linear-gradient(var(--green1),var(--green2));box-shadow:0 5px 0 #0d6b2c}
.mbtn.blue{background:linear-gradient(#5aa9ff,#2f6fed);box-shadow:0 5px 0 #173f8f}
.mbtn.gray{background:linear-gradient(#5b6478,#3b4254);box-shadow:0 5px 0 #23283a}
.mbtn.red{background:linear-gradient(#ff6b6b,#d62839);box-shadow:0 5px 0 #7a0f1c}
.mbtn:disabled{opacity:.45}
.mclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;background:#0006;font-size:18px;display:flex;align-items:center;justify-content:center}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.day{background:#0005;border-radius:14px;padding:8px 2px;font-size:13px;border:2px solid transparent}
.day b{display:block;font-size:24px}
.day.done{opacity:.4}
.day.today{border-color:#ffd166;background:#ffd16622;animation:bump 1s infinite}
.day.d7{grid-column:span 2;background:linear-gradient(#7b2ff7aa,#3a0ca3aa)}
.mis{display:flex;align-items:center;gap:10px;background:#0005;border-radius:14px;padding:10px;margin:8px 0;text-align:left}
.mis .t{flex:1;font-size:15px}
.mis button{border-radius:12px;padding:8px 10px;font-weight:800;background:linear-gradient(#ffd166,#f59f00);color:#3b2600;box-shadow:0 3px 0 #9a6200;white-space:nowrap;display:flex;align-items:center;gap:3px}
.mis button:disabled{background:#4a5266;color:#aab;box-shadow:none}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.skin{background:#0005;border-radius:16px;padding:8px;border:3px solid transparent}
.skin.sel{border-color:#5ee36b}
.skin .pv{height:58px;margin:4px 6px}
.skin .nm{font-weight:800;font-size:15px}
.skin button{margin-top:4px;width:100%;border-radius:10px;padding:5px;font-weight:800;background:linear-gradient(#ffd166,#f59f00);color:#3b2600;display:flex;align-items:center;justify-content:center;gap:3px}
.skin button.u{background:#2f80ed;color:#fff}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.lv{aspect-ratio:1;border-radius:14px;background:linear-gradient(#3f4b6e,#28304a);box-shadow:0 4px 0 #161b2b;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lv small{font-size:10px;letter-spacing:-1px;margin-top:2px;color:#ffffff55}.lv small b{color:#ffd23f}
.lv.hard{background:linear-gradient(#ff7b7b,#b3202f);box-shadow:0 4px 0 #6b0f19}
.lv.cur{background:linear-gradient(var(--green1),var(--green2));box-shadow:0 4px 0 #0d6b2c;animation:bump 1.2s infinite}
.lv.lock{opacity:.35}
.set{display:flex;align-items:center;justify-content:space-between;background:#0005;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:17px;font-weight:700}
.sw{width:54px;height:30px;border-radius:16px;background:#4a5266;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px #0006}
.sw.on{background:#1fa64a}.sw.on::after{left:27px}
#chestIcon{font-size:96px;display:inline-block}
#chestIcon.shake{animation:cshake .12s infinite}
@keyframes cshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#chestIcon.open{animation:copen .5s forwards}
@keyframes copen{50%{transform:scale(1.5)}100%{transform:scale(1.2)}}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:14px;z-index:50;font-weight:800;display:none;white-space:nowrap}
.info{color:#9fb0d0;font-size:13px;min-height:20px;position:relative}
</style>
</head>
<body>
<div id="top">
  <button class="iconbtn" id="leftBtn"></button>
  <div id="lvlLabel"></div>
  <div class="pill" id="coinBox"><i data-ic="coin"></i><span id="coins">0</span></div>
</div>

<div class="screen on" id="home">
  <div class="bgcars" id="bgcars"></div>
  <div class="logo">
    <svg id="logoCar" viewBox="-15 -10 260 130"></svg>
    <h1>OTOPARK<br>KAÇIŞI</h1>
    <p>DOKUN · ÇIKAR · KAZAN</p>
  </div>
  <button class="big" id="playBtn">OYNA<small id="playLv">Bölüm 1</small></button>
  <div id="homeStreak" class="info"></div>
  <div class="tiles">
    <button class="tile" id="tLv"><i data-ic="map"></i><span>Bölümler</span></button>
    <button class="tile" id="tDaily"><i data-ic="gift"></i><span>Günlük</span><i class="badge" id="bDaily">!</i></button>
    <button class="tile" id="tMis"><i data-ic="list"></i><span>Görevler</span><i class="badge" id="bMis">!</i></button>
    <button class="tile" id="tGar"><i data-ic="car"></i><span>Garaj</span></button>
  </div>
  <div class="chestbar"><i data-ic="chest"></i> Sandık: <b id="chestTxt">0/10</b><div class="bar"><i id="chestFill"></i></div></div>
  <div class="ver">v4.0</div>
</div>

<div class="screen" id="game">
  <div id="hudRow">
    <div id="hearts"></div>
    <div id="streak"></div>
    <div id="miniChest"><i data-ic="chest"></i> <span id="mcTxt"></span><div class="bar"><i id="mcFill"></i></div></div>
  </div>
  <div id="progWrap"><span id="progTxt"></span><div class="bar g"><i id="progFill"></i></div></div>
  <div id="stage"><div id="curb"><div id="board"></div></div></div>
  <div id="boosts">
    <button class="boost" id="bHint"><i data-ic="bulb"></i><span id="hintCost"></span><i class="cnt" id="hintCnt"></i></button>
    <button class="boost" id="bCrane"><i data-ic="crane"></i><span id="craneCost"></span><i class="cnt" id="craneCnt"></i></button>
    <button class="boost" id="bRestart"><i data-ic="restart"></i><span>Baştan</span></button>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="combo"></div>
<div id="intro"><div class="card"><h2 id="introT"></h2><p id="introP"></p></div></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ================= ICONS ================= */
const P={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 pause:'<path d="M9 5v14M15 5v14" stroke-width="3"/>',

const A={};
function ac(){
  try{
    if(!A.ctx){const C=window.AudioContext||window.webkitAudioContext;A.ctx=new C();
      A.master=A.ctx.createGain();A.master.gain.value=.7;A.master.connect(A.ctx.destination);
      A.sfx=A.ctx.createGain();A.sfx.connect(A.master);A.mus=A.ctx.createGain();A.mus.gain.value=.12;A.mus.connect(A.master);
      const len=A.ctx.sampleRate;A.nb=A.ctx.createBuffer(1,len,A.ctx.sampleRate);const d=A.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
    if(A.ctx.state==='suspended')A.ctx.resume();
    A.sfx.gain.value=S.sound?1:0;return A.ctx;
  }catch(e){return null}
}
function tone(f,t0,d,type,vol,f2,dest){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||.2,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g).connect(dest||A.sfx);o.start(t0);o.stop(t0+d+.05)}
function noise(t0,d,vol,freq,type,dest){const c=ac();if(!c)return;const s=c.createBufferSource();s.buffer=A.nb;const f=c.createBiquadFilter();
  f.type=type||'lowpass';f.frequency.value=freq||1000;const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f).connect(g).connect(dest||A.sfx);s.start(t0);s.stop(t0+d+.05)}
const now=()=>{const c=ac();return c?c.currentTime:0};

const MUS={step:0,next:0,timer:null};
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const MEL=[76,null,74,72,null,72,74,76,72,null,69,null,72,74,null,72,76,null,79,76,null,74,72,null,74,null,71,null,74,76,null,74];
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
  const c=ac();if(!c)return;const spb=60/112/2;
  if(MUS.next<c.currentTime)MUS.next=c.currentTime+.05;
  while(MUS.next<c.currentTime+.25){
    const s=MUS.step%64,bar=Math.floor(s/16)%4,t=MUS.next,ch=CH[bar];
    if(s%4===0)tone(mf(ch[0]-12),t,spb*3.5,'triangle',.5,null,A.mus);
    if(s%2===0)tone(mf(ch[(s/2)%3]+12),t,spb*.9,'square',.07,null,A.mus);
    if(s%4===2)noise(t,.05,.25,8000,'highpass',A.mus);
    if(s%8===4)noise(t,.12,.35,1800,'bandpass',A.mus);
    const m=MEL[s%32];if(m&&s>=16)tone(mf(m),t,spb*1.6,'triangle',.2,null,A.mus);
    MUS.step++;MUS.next+=spb;
  }
}
function setMusic(){
  if(S.music){const c=ac();if(!c)return;if(!MUS.timer){MUS.next=c.currentTime+.1;MUS.timer=setInterval(musicTick,80)}}
  else if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null}
}

const fx=$('fx'),fc=fx.getContext('2d');let PT=[];
function fxResize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function emit(o){PT.push(Object.assign({life:0,rot:Math.random()*6,vr:(Math.random()-.5)*.3,g:0},o))}
function smoke(x,y,dx,dy,n=6){for(let i=0;i<n;i++)emit({t:'s',x,y,vx:-dx*(1+Math.random()*2)+(Math.random()-.5)*1.2,vy:-dy*(1+Math.random()*2)+(Math.random()-.5)*1.2,max:40+Math.random()*20,size:5+Math.random()*5})}
function sparks(x,y,n=18){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*5;emit({t:'k',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.15,max:25+Math.random()*15})}}
function confetti(n=120){const cols=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#fff'];for(let i=0;i<n;i++)emit({t:'c',x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,g:.32,max:120+Math.random()*60,size:6+Math.random()*6,col:cols[i%cols.length]})}
function twinkle(x,y,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;emit({t:'st',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,max:40,size:3+Math.random()*3})}}
function ripple(x,y){emit({t:'r',x,y,vx:0,vy:0,max:18,size:cell*.5})}
function fxLoop(){
  fc.clearRect(0,0,innerWidth,innerHeight);PT=PT.filter(p=>p.life<p.max);
  for(const p of PT){p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;const k=1-p.life/p.max;
    if(p.t==='s'){p.vx*=.94;p.vy*=.94;fc.globalAlpha=k*.55;fc.fillStyle='#cfd3da';fc.beginPath();fc.arc(p.x,p.y,p.size*(1.8-k),0,6.28);fc.fill()}
    else if(p.t==='k'){fc.globalAlpha=k;fc.strokeStyle=k>.5?'#fff6a0':'#ff9f1c';fc.lineWidth=2.5;fc.beginPath();fc.moveTo(p.x,p.y);fc.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);fc.stroke()}
    else if(p.t==='c'){p.vx*=.98;fc.globalAlpha=Math.min(1,k*3);fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillStyle=p.col;fc.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);fc.restore()}
    else if(p.t==='st'){fc.globalAlpha=k;fc.fillStyle='#ffe066';fc.beginPath();fc.arc(p.x,p.y,p.size*k,0,6.28);fc.fill()}
    else if(p.t==='r'){fc.globalAlpha=k*.6;fc.strokeStyle='#fff';fc.lineWidth=3;fc.beginPath();fc.arc(p.x,p.y,p.size*(1.2-k*.7),0,6.28);fc.stroke()}
  }
  fc.globalAlpha=1;requestAnimationFrame(fxLoop);
}

/* ================= LEVEL GEN ================= */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],ROT=[-90,0,90,180];
let N,cars=[],OBS=[],WALK=null,hearts=3,cell=40,busy=false,combo=0,lastExit=0,maxCombo=0,usedHint=false,crane=false,levelCoins=0,levelDone=true,curLevel=1,total=0,paused=false;
let movesLeft=null,ambLeft=null,walkTimer=null;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* occupancy: closed gates block, open gates (their car gone) do not */
function buildOcc(list){const occ={};OBS.forEach(o=>{if(o.gate&&!list.includes(o.car))return;occ[o.y*N+o.x]=o});list.forEach(c=>c.cells.forEach(([x,y])=>occ[y*N+x]=c));return occ}
const isLocked=(car,occ)=>!!(car.lockBy&&occ[car.lockBy.cells[0][1]*N+car.lockBy.cells[0][0]]===car.lockBy);
function pathCells(car){const[dx,dy]=DIRS[car.dir];let[x,y]=car.cells[0];const p=[];while(true){x+=dx;y+=dy;if(x<0||y<0||x>=N||y>=N)return p;p.push([x,y])}}

  while(moved&&rest.length){moved=false;const o=buildOcc(rest);const out=rest.filter(c=>canExit(c,o));if(out.length){rest=rest.filter(c=>!out.includes(c));moved=true}}
  return rest.length===0}
function depthOf(list){let rest=list.slice(),d=0,first=0;while(rest.length){const o=buildOcc(rest);const ex=rest.filter(c=>canExit(c,o));if(!ex.length)return{d:-1,first};if(!d)first=ex.length;rest=rest.filter(c=>!ex.includes(c));d++}return{d,first}}
const isBoss=lv=>lv%10===0;
const isHard=lv=>lv%5===0&&!isBoss(lv);
function features(lv,r){const f={
  walk:lv>=13&&(lv===13||r()<.5),
  key:lv>=18&&(lv===18||r()<.5),
  gate:lv>=23&&(lv===23||r()<.45),
  amb:lv>=27&&(lv===27||r()<.35)};
  if(isBoss(lv)){const on=Object.keys(f).filter(k=>f[k]);on.slice(1).forEach(k=>f[k]=false)} // boss: max 1 feature
  if(lv===13||lv===18||lv===23||lv===27){for(const k in f)f[k]=false;f[{13:'walk',18:'key',23:'gate',27:'amb'}[lv]]=true} // first appearance alone
  return f}
function generate(lv){
  let best=null;const K=lv<3?1:6;
  for(let k=0;k<K;k++){const g=genOnce(lv,lv*9973+17+k*7919);OBS=g.obs;N=g.N;
    const{d,first}=depthOf(g.list);if(d<0)continue;
    g.score=d*3-first+g.list.length*.5;if(!best||g.score>best.score)best=g}
  OBS=best.obs;N=best.N;WALK=best.walk;return best.list;
}
function genOnce(lv,seed){
  const r=rng(seed),boss=isBoss(lv),hard=isHard(lv)||boss;
  N=Math.min(5+Math.floor((lv+1)/3),9);
  const F=features(lv,r);
  let target=Math.min(4+Math.floor(lv*1.6),Math.floor(N*N*0.42));
  if(hard)target=Math.min(Math.floor(target*1.25)+1,Math.floor(N*N*0.47));
  if(F.walk)target=Math.floor(target*.85);
  const res={};let walk=null;
  if(F.walk){const horiz=r()<.5,idx=1+Math.floor(r()*(N-2));walk={horiz,idx};for(let i=0;i<N;i++)res[horiz?idx*N+i:i*N+idx]=1}
  OBS=[];const nObs=lv>6?Math.min(Math.floor((lv-3)/4),5):0;
  for(let i=0;i<nObs*10&&OBS.length<nObs;i++){const x=Math.floor(r()*N),y=Math.floor(r()*N);if(x===0||y===0||x===N-1||y===N-1||res[y*N+x])continue;if(OBS.some(o=>o.x===x&&o.y===y))continue;OBS.push({x,y,obstacle:true})}
  let list=[],occ={};OBS.forEach(o=>occ[o.y*N+o.x]=o);
  for(let t=0;t<target*80&&list.length<target;t++){
    const dir=Math.floor(r()*4),len=(lv>4&&r()<0.2)?3:2,[dx,dy]=DIRS[dir];
    const hx=Math.floor(r()*N),hy=Math.floor(r()*N),cells=[];let ok=true;
    for(let i=0;i<len;i++){const x=hx-dx*i,y=hy-dy*i;if(x<0||y<0||x>=N||y>=N||occ[y*N+x]||res[y*N+x]){ok=false;break}cells.push([x,y])}
    if(!ok)continue;const c={dir,len,cells};list.push(c);
    if(!solvable(list)){list.pop();continue}
    cells.forEach(([x,y])=>occ[y*N+x]=c);
  }
  list.forEach(c=>c.color=PAL[Math.floor(r()*PAL.length)]);
  const pick=()=>list[Math.floor(r()*list.length)];
  // KEY + LOCK
  if(F.key&&list.length>3){for(let t=0;t<16;t++){const K=pick(),L=pick();if(K===L)continue;L.lockBy=K;
    if(solvable(list)){K.hasKey=true;break}delete L.lockBy}}
  // GATE (barrier) on some car's exit path, opened by another car
  if(F.gate&&list.length>3){const o0=buildOcc(list);
    for(let t=0;t<40;t++){const a=pick(),pc=pathCells(a).filter(([x,y])=>o0[y*N+x]===undefined&&!res[y*N+x]);if(!pc.length)continue;
      const[x,y]=pc[Math.floor(r()*pc.length)],C=pick();if(C===a||C.lockBy||C.hasKey)continue;
      const gt={x,y,gate:true,car:C,col:['#2f80ed','#9b51e0','#27ae60'][Math.floor(r()*3)]};OBS.push(gt);
      if(solvable(list)){C.gateKey=gt;break}OBS.pop()}}
  // AMBULANCE: must leave within a tap budget
  if(F.amb){const cand=list.filter(c=>c.len===2&&!c.lockBy&&!c.hasKey&&!c.gateKey).map(c=>({c,d:depsOf(c,list)})).filter(o=>o.d>=1&&o.d<=6);
    if(cand.length){const o=cand[Math.floor(r()*cand.length)];o.c.amb=true;o.c.ambBudget=o.d+3;o.c.color='#ffffff'}}

}
/* cars that must leave before c can leave (transitive) */
function depsOf(c,list,asSet){const occ=buildOcc(list),seen=new Set(),st=[c];
  while(st.length){const k=st.pop();const add=o=>{if(o&&o!==c&&!seen.has(o)&&list.includes(o)){seen.add(o);st.push(o)}};
    pathCells(k).forEach(([x,y])=>{const o=occ[y*N+x];if(!o)return;if(o.gate)add(o.car);else if(!o.obstacle)add(o)});
    if(k.lockBy)add(k.lockBy)}
  return asSet?seen:seen.size}

  renderCoins();

function cellCenter(x,y){const r=boardRect();return[r.left+(x+.5)*cell,r.top+(y+.5)*cell]}

$('board').addEventListener('pointerdown',e=>{
  e.preventDefault();ac();setMusic();
  if(levelDone||paused)return;
  const r=boardRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);
  if(x<0||y<0||x>=N||y>=N)return;

/* a car left the lot (drove out or crane): unlock / open gate */
function onCarGone(c){
  if(c.hasKey){const L=cars.find(k=>k.lockBy===c);if(L){const[ax,ay]=cellCenter(c.cells[0][0],c.cells[0][1]);
    const k=document.createElement('div');k.className='flycoin';k.innerHTML=ic('key');k.style.left=ax+'px';k.style.top=ay+'px';document.body.appendChild(k);
    const[bx,by]=cellCenter(L.cells[0][0],L.cells[0][1]);requestAnimationFrame(()=>requestAnimationFrame(()=>{k.style.transform=`translate(${bx-ax}px,${by-ay}px) scale(1.4)`}));
    setTimeout(()=>{k.remove();L.el.classList.remove('locked');const bd=L.el.querySelector('.lockb');if(bd){bd.classList.add('pop');setTimeout(()=>bd.remove(),400)}
      SFX.unlock();twinkle(bx,by,14)},620)}}
  if(c.gateKey){const g=c.gateKey;if(g.el){g.el.classList.add('open');setTimeout(()=>SFX.gate(),100)}}
  if(c.amb){ambLeft=null;toast(ic('plus')+' Ambulans yola çıktı!')}
}
function useMove(){
  if(movesLeft!=null){movesLeft--;renderHUD()}
}
function useAmb(c){if(ambLeft!=null&&!c.amb){ambLeft--;renderHUD()}}
function checkFail(){
  if(levelDone)return true;
  if(hearts<=0){lose('hearts');return true}
  if(ambLeft!=null&&ambLeft<=0&&cars.some(c=>c.amb)){lose('amb');return true}
  if(movesLeft!=null&&movesLeft<=0&&cars.length){lose('moves');return true}
  return false;
}
function tap(c){
  if(busy||levelDone||!cars.includes(c))return;
  document.querySelectorAll('.car.hint').forEach(e=>e.classList.remove('hint'));
  if(crane){useCraneOn(c);return}
  const occ=buildOcc(cars),[dx,dy]=DIRS[c.dir];
  if(isLocked(c,occ)){SFX.lock();buzz(20);c.el.classList.remove('wob');void c.el.offsetWidth;c.el.classList.add('wob');toast(ic('lock')+' Önce anahtarlı arabayı çıkar!');return}
  const path=pathCells(c);let bi=path.findIndex(([x,y])=>{const o=occ[y*N+x];return o!==undefined&&o!==c});
  const wc=walkerCell();let wi=wc?path.findIndex(([x,y])=>x===wc[0]&&y===wc[1]):-1;
  // also count the walker's next cell if it is stepping into the lane
  if(wi<0&&WALK){const nx=WALK.pos+WALK.d,nc=WALK.horiz?[nx,WALK.idx]:[WALK.idx,nx];const j=path.findIndex(([x,y])=>x===nc[0]&&y===nc[1]);if(j===0)wi=0}
  const hitWalker=wi>=0&&(bi<0||wi<bi);
  const[hx,hy]=cellCenter(c.cells[0][0],c.cells[0][1]);
  useMove();useAmb(c);
  if(bi<0&&!hitWalker){
    cars=cars.filter(k=>k!==c);
    const t=performance.now();combo=(t-lastExit<1400)?combo+1:1;lastExit=t;maxCombo=Math.max(maxCombo,combo);
    c.amb?SFX.siren():SFX.engine();buzz(15);mission('cars',1);
    const tail=c.cells[c.cells.length-1],[tx,ty]=cellCenter(tail[0],tail[1]);smoke(tx-dx*cell*.4,ty-dy*cell*.4,dx,dy,8);
    let gain=1;
    if(combo>=2){gain=Math.min(combo,5);showCombo(combo);SFX.combo(Math.min(combo,8));mission('combo',combo,true)}
    if(c.amb)gain+=10;
    levelCoins+=gain;floatText(hx,hy,'+'+gain+ic('coin'));
    const el=c.el;el.classList.add('go');el.style.zIndex=5;
    el.style.transition='transform .09s ease-out';el.style.transform=`translate(${-dx*6}px,${-dy*6}px)`;
    setTimeout(()=>{const dist=(N+c.len+1)*cell;el.style.transition=`transform ${.32+N*.025}s cubic-bezier(.55,0,1,.45), opacity .5s .2s`;
      el.style.transform=`translate(${dx*dist}px,${dy*dist}px)`;el.style.opacity='0';SFX.whoosh()},95);
    setTimeout(()=>el.remove(),900);onCarGone(c);renderHUD();
    if(!cars.length){levelDone=true;stopWalker();setTimeout(win,650);return}
    setTimeout(checkFail,300);
  }else{
    const k=hitWalker?wi:bi,blocker=hitWalker?null:occ[path[bi][1]*N+path[bi][0]];
    busy=true;combo=0;
    const d=k*cell+cell*.1,el=c.el;el.style.zIndex=4;el.style.transition='transform .16s cubic-bezier(.6,0,1,.6)';el.style.transform=`translate(${dx*d}px,${dy*d}px)`;
    setTimeout(()=>{
      SFX.crash();SFX.horn();buzz([40,30,40]);
      const r=boardRect(),cx=path[k][0],cy=path[k][1];sparks(r.left+(cx+.5-dx*.5)*cell,r.top+(cy+.5-dy*.5)*cell,22);
      const g=$('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
      if(hitWalker){WALK.el.classList.remove('jump');void WALK.el.offsetWidth;WALK.el.classList.add('jump');SFX.yelp();toast(ic('walker')+' Dikkat, yaya!')}
      else if(blocker&&blocker.el&&!blocker.obstacle){blocker.el.classList.remove('wob');void blocker.el.offsetWidth;blocker.el.classList.add('wob')}
      loseHeart();
      el.style.transition='transform .28s cubic-bezier(.2,1.4,.4,1)';el.style.transform='';
    },165);
    setTimeout(()=>{busy=false;el.style.zIndex='';checkFail()},520);
  }
}
function loseHeart(){hearts--;SFX.heart();const sp=$('hearts').children[hearts];if(sp){sp.classList.add('breaking');setTimeout(renderHUD,480)}}
function showCombo(n){const w=['','','GÜZEL!','SÜPER!','HARİKA!','MUHTEŞEM!','EFSANE!'];const e=$('combo');e.innerHTML=`${w[Math.min(n,6)]}<br><span style="font-size:28px">x${n} KOMBO</span>`;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function bestHintCar(){
  const occ=buildOcc(cars),wc=walkerCell();
  const free=cars.filter(k=>canExit(k,occ)&&!(wc&&pathCells(k).some(([x,y])=>x===wc[0]&&y===wc[1])));
  const all=free.length?free:cars.filter(k=>canExit(k,occ));
  // prefer ambulance, then cars that unlock something, then cars on the ambulance's route
  const amb=cars.find(c=>c.amb);
  const need=amb?depsOf(amb,cars,true):null;
  return all.find(c=>c.amb)||(need&&all.find(c=>need.has(c)))||all.find(c=>c.hasKey||c.gateKey)||all[0];
}

/* ================= WIN / LOSE ================= */
function win(){
  stopWalker();
  const boss=isBoss(curLevel),hard=isHard(curLevel),st=Math.max(1,hearts),replay=curLevel<S.level,mul=boss?3:hard?2:1;
  if(!replay)S.streak++;
  const base=10+curLevel*2,starB=st*5;let sum=Math.round((base+starB+levelCoins)*mul*(replay?1:mult()));if(replay)sum=Math.round(sum/2);
  mission('wins',1);if(st===3)mission('stars3',1);if(!usedHint)mission('nohint',1);
  const prevStars=S.stars[curLevel]||0;S.stars[curLevel]=Math.max(prevStars,st);
  let chestReady=false;const chestBefore=S.chest;
  if(!replay){S.chest+=st;if(boss)S.chest+=3;if(S.chest>=10){S.chest-=10;chestReady=true}S.level++;if(boss)S.cranes++}
  save();SFX.win();confetti(boss?200:120);buzz(60);
  modal(`<div class="ribbon ${boss?'bossr':''}">${boss?'BOSS':hard?'ZOR BÖLÜM':'BÖLÜM'} ${curLevel}</div><h2>${boss?'Boss yenildi!':'Tebrikler!'}</h2>
   <div class="stars"><b>${ic('star')}</b><b>${ic('star')}</b><b>${ic('star')}</b></div>
   <div class="rows"><div><span>Bölüm ödülü</span><b>+${base}</b></div><div><span>Yıldız bonusu</span><b>+${starB}</b></div>
   <div><span>Araba & kombo</span><b>+${levelCoins}</b></div>${mul>1?`<div><span>${boss?'Boss':'Zor bölüm'}</span><b>x${mul}</b></div>`:''}
   ${!replay&&S.streak>1?`<div><span>${ic('fire')} ${S.streak} bölüm seri</span><b>x${mult().toFixed(2)}</b></div>`:''}${replay?'<div><span>Tekrar oynama</span><b>÷2</b></div>':''}
   ${boss&&!replay?`<div><span>${ic('crane')} Boss hediyesi</span><b>+1 Vinç</b></div>`:''}
   <div class="tot"><span>Toplam</span><span>${ic('coin')} <span id="cnt">0</span></span></div></div>
   ${replay?'':`<div style="font-size:13px;color:#cfd8ee">${ic('chest')} Sandık ${chestReady?'<b style="color:#ffd166">HAZIR!</b>':Math.min(chestBefore+st+(boss?3:0),10)+'/10'}</div>`}
   <button class="mbtn" id="mNext">${chestReady?'Sandığı aç':'Sonraki bölüm'} ${ic('play')}</button><button class="mbtn gray" id="mHome">${ic('home')} Ana menü</button>`);
  const sb=document.querySelectorAll('.stars b');for(let i=0;i<st;i++)setTimeout(()=>{sb[i].classList.add('on');SFX.star(i);const r=sb[i].getBoundingClientRect();twinkle(r.left+r.width/2,r.top+r.height/2,10)},350+i*330);
  let n=0;const cntEl=$('cnt'),iv=setInterval(()=>{n=Math.min(sum,n+Math.ceil(sum/25));cntEl.textContent=n;if(n>=sum)clearInterval(iv)},40);
  let paid=false;const pay=()=>{if(paid)return;paid=true;const r=$('cnt').getBoundingClientRect();flyCoins(r.left,r.top,Math.min(10,Math.ceil(sum/10)),sum)};
  const next=replay?curLevel+1:S.level;
  $('mNext').onclick=()=>{SFX.click();pay();closeModal();if(chestReady)setTimeout(()=>openChest(()=>startLevel(next)),700);else setTimeout(()=>startLevel(next),700)};
  $('mHome').onclick=()=>{SFX.click();pay();closeModal();setTimeout(()=>{if(chestReady)openChest(goHome);else goHome()},700)};
}
function lose(reason){
  if(levelDone)return;levelDone=true;stopWalker();SFX.lose();
  const R={hearts:{t:'Otopark kilitlendi!',e:'💥',b:`${ic('heart')} +1 can · 40 ${ic('coin')}`},

   <button class="mbtn red" id="mReset">İlerlemeyi sıfırla</button>`);
  bindSwitches();$('mX').onclick=()=>{SFX.click();closeModal()};
  $('mReset').onclick=()=>{const b=$('mReset');if(!b.dataset.c){b.dataset.c=1;b.textContent='Emin misin? Tekrar dokun';return}
    S=JSON.parse(JSON.stringify(DEF));save();closeModal();goHome();toast('İlerleme sıfırlandı')};
}
function showPause(){
  SFX.click();if(levelDone&&!cars.length)return;paused=true;
  modal(`<div class="ribbon">DURAKLATILDI</div>${settingsRows()}
   <button class="mbtn" id="mRes">${ic('play')} Devam et</button>
   <button class="mbtn blue" id="mRst">${ic('restart')} Baştan başla</button>
   <button class="mbtn gray" id="mHm">${ic('home')} Ana menü</button>`);
  bindSwitches();
  $('mRes').onclick=()=>{SFX.click();paused=false;closeModal()};
  $('mRst').onclick=()=>{SFX.click();forfeit();closeModal();startLevel()};
  $('mHm').onclick=()=>{SFX.click();forfeit();levelDone=true;closeModal();goHome()};
}

/* ================= SCREENS ================= */
function modal(html){$('mbox').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
let screen='home';
function show(id){screen=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  $('leftBtn').innerHTML=ic(id==='home'?'gear':'pause')}
function drawLogo(){$('logoCar').innerHTML='<g transform="translate(5,8)">'+carSVG(2,'#ef476f',skinObj(S.skin)).replace('<svg','<svg width="210" height="105"')+'</g>'}
function drawBgCars(){
  const lanes=[18,46,74],sk=skinObj(S.skin);let h='';
  lanes.forEach((t,i)=>{h+=`<div class="road" style="top:calc(${t}% - 37px)"></div>`;
    for(let k=0;k<2;k++){const dur=9+i*3+k*2,del=-(k*dur/2+i*1.7);h+=`<div class="bc ${i===1?'rev':''}" style="top:calc(${t}% - 30px);animation-duration:${dur}s;animation-delay:${del}s">${carSVG(2,PAL[(i*3+k*5)%PAL.length],sk)}</div>`}});
  $('bgcars').innerHTML=h;
}
function homeBadges(){
  $('bDaily').style.display=dailyAvailable()?'flex':'none';
  const c=claimable();$('bMis').style.display=c?'flex':'none';$('bMis').textContent=c;
  $('chestTxt').textContent=S.chest+'/10';$('chestFill').style.width=(S.chest*10)+'%';
  $('playLv').textContent=(isBoss(S.level)?'BOSS · ':isHard(S.level)?'ZOR · ':'')+'Bölüm '+S.level;
  $('homeStreak').innerHTML=S.streak>0?`${ic('fire')} ${S.streak} bölüm seri · ödül x${mult().toFixed(2)}`:'Kaybetmeden bölüm geç, seri çarpanı kazan!';
  renderCoins();
}
function goHome(){stopWalker();levelDone=true;show('home');$('lvlLabel').innerHTML='';drawBgCars();drawLogo();homeBadges()}
function play(lv){ac();setMusic();SFX.click();show('game');requestAnimationFrame(()=>startLevel(lv||S.level))}
$('playBtn').onclick=()=>play();
$('leftBtn').onclick=()=>{screen==='home'?showSettings():showPause()};
$('tLv').onclick=()=>{ac();setMusic();showLevels()};
$('tDaily').onclick=()=>{ac();setMusic();showDaily()};
$('tMis').onclick=()=>{ac();setMusic();showMissions()};
$('tGar').onclick=()=>{ac();setMusic();showGarage()};
$('bHint').onclick=hint;$('bCrane').onclick=craneBtn;
$('bRestart').onclick=()=>{SFX.click();if(levelDone)return;forfeit();startLevel()};
addEventListener('resize',()=>{fxResize();layout()});
document.addEventListener('pointerdown',()=>{ac();if(S.music&&!MUS.timer)setMusic()},{once:true});
document.addEventListener('visibilitychange',()=>{if(!A.ctx)return;if(document.hidden)A.ctx.suspend();else if(S.music||S.sound)A.ctx.resume()});

paintIcons();fxResize();fxLoop();ensureMissions();goHome();
if(dailyAvailable())setTimeout(showDaily,700);
</script>
</body>
</html>
