<style>
/* Layout: tek sütun uygulama, optik form estetiği (kırmızı baskı + kurşun kalem dolgulu baloncuklar), altta sabit sekme çubuğu */

{id:"usler",d:"mat",k:"Üslü İfadeler",s:"TYT",z:2,f(){const a=pick([2,3,5]);let m,n,p,e;do{m=R(2,7);n=R(2,7);p=R(2,8);e=m+n-p}while(e<1||e>(a===2?6:a===3?4:3));const ans=a**e,S=x=>`<sup>${x}</sup>`;
 return{q:`(${a}${S(m)} · ${a}${S(n)}) / ${a}${S(p)} işleminin sonucu kaçtır?`,...nums(ans,[a**(e+1),a**Math.max(0,e-1),a*e,e,a**(m*n-p)]),c:`Aynı tabanlı üslerin çarpımında üsler toplanır, bölümünde çıkarılır: ${a}${S(`${m}+${n}−${p}`)} = ${a}${S(e)} = <b>${ans}</b>.`}}},
{id:"ebobekok",d:"mat",k:"EBOB - EKOK",s:"TYT",z:2,f(){const [x,y]=pick([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7],[4,7],[5,7],[2,7]]);const g=R(2,6),A=g*x,B=g*y;

{id:"ardisik",d:"mat",k:"Ardışık Sayılar",s:"TYT",z:1,f(){const n=R(10,40),t=R(0,2);
 if(t===0){const ans=n*(n+1)/2;return{q:`1 + 2 + 3 + … + ${n} toplamı kaçtır?`,...nums(ans,[n*n,n*(n+1),n*(n-1)/2,ans+n]),c:`İlk n doğal sayının toplamı n(n+1)/2: ${n}·${n+1}/2 = <b>${ans}</b>.`}}

const LS="netpusula-yks-v1";
const fresh=()=>({stats:{},days:{},defter:{},denemeler:[],goal:60,alan:"SAY",focus:{},konu:{},daily:null,ver:1});
let S=fresh();
try{const raw=localStorage.getItem(LS);if(raw){S=Object.assign(fresh(),JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

const TYT_DATE=new Date("2027-06-19T10:15:00+03:00");
const AYT_DATE=new Date("2027-06-20T10:15:00+03:00");
const DAY=864e5;
const BOX_DAYS=[0,1,3,7,15,30];

function key(q){return q.d+"|"+q.k}
function record(q,ok,ms){
  const k=key(q);const st=S.stats[k]||(S.stats[k]={t:0,c:0,ms:0});
  st.t++;if(ok)st.c++;st.ms+=Math.min(ms||0,600000);
  const t=todayKey();S.days[t]=(S.days[t]||0)+1;
  if(!ok)toDefter(q);
}
function toDefter(q){
  const e=S.defter[q.id];
  const clean={id:q.id,d:q.d,k:q.k,s:q.s,z:q.z,q:q.q,o:q.o,a:q.a,c:q.c,fixed:q.fixed};
  if(e){e.box=1;e.due=Date.now()+DAY;e.wrong=(e.wrong||1)+1;e.q=clean;e.son=Date.now()}
  else S.defter[q.id]={q:clean,box:1,due:Date.now()+DAY,added:Date.now(),son:Date.now(),wrong:1};
}
function dueList(){const now=Date.now();return Object.values(S.defter).filter(e=>e.box<=5&&e.due<=now)}
function streak(){let n=0;const d=new Date();if(!S.days[todayKey(d)])d.setDate(d.getDate()-1);while(S.days[todayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}

/* ============ Soru seçimi ============ */
function prep(q){
  q=JSON.parse(JSON.stringify(q));
  if(!q.fixed&&!q.gen){const idx=shuf(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a)}
  return q;
}
function genQ(g){const r=g.f();return{id:"g-"+g.id+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:g.d,k:g.k,s:g.s,z:g.z,gen:true,...r}}
function sources(f){
  const ok=x=>(!f.d||f.d.includes(x.d))&&(!f.s||x.s===f.s)&&(!f.k||(Array.isArray(f.k)?f.k.includes(x.k):x.k===f.k))&&(!f.z||x.z===f.z);
  return{st:BANK.filter(ok),gn:GEN.filter(ok)};
}
function draw(f,n,used){
  used=used||new Set();const {st,gn}=sources(f);const out=[];
  const usedT=used.T||(used.T=new Set());
  let stl=shuf(st.filter(q=>!used.has(q.id)&&!usedT.has(q.q)));
  for(let i=0;i<n;i++){
    const useGen=gn.length&&(!stl.length||Math.random()<gn.length/(gn.length+stl.length*0.9));
    if(useGen)out.push(genQ(pick(gn)));
    else{while(stl.length&&usedT.has(stl[stl.length-1].q))stl.pop();if(stl.length){const q=stl.pop();used.add(q.id);usedT.add(q.q);out.push(prep(q))}}
  }
  return out;
}
function konular(dlist,s){const set=new Map();BANK.concat(GEN).forEach(x=>{if(dlist.includes(x.d)&&(!s||x.s===s))set.set(x.k,x.d)});return [...set.keys()].sort((a,b)=>a.localeCompare(b,"tr"))}

/* ---- Analiz ---- */
function analiz(){
  const per={};Object.entries(S.stats).forEach(([k,s])=>{const d=k.split("|")[0];if(!DERS[d])return;const p=per[d]||(per[d]={t:0,c:0,ms:0});p.t+=s.t;p.c+=s.c;p.ms+=s.ms});
  const topics=Object.entries(S.stats).filter(([k,s])=>DERS[k.split("|")[0]]).map(([k,s])=>{const [d,kk]=k.split("|");return{d,k:kk,...s}}).sort((a,b)=>(a.c/a.t)-(b.c/b.t));
  return header("Analiz","Ders, konu ve deneme gelişimi")+`
  <div class="sec"><h2>Deneme net grafiği</h2><div class="sheet">${netChart()}</div></div>
  <div class="sec"><h2>Ders bazında başarı</h2>${Object.keys(per).length?`<div class="sheet tbl-wrap"><table><thead><tr><th>Ders</th><th class="n">Soru</th><th class="n">Doğru %</th><th class="n">Ort. süre</th></tr></thead><tbody>${Object.entries(per).sort((a,b)=>b[1].t-a[1].t).map(([d,p])=>`<tr><td>${DERS[d].ad}<div class="bar ${p.c/p.t>=.7?"ok":p.c/p.t<.45?"bad":""}" style="margin-top:4px;max-width:160px"><i style="width:${Math.round(p.c/p.t*100)}%"></i></div></td><td class="n">${p.t}</td><td class="n">${Math.round(p.c/p.t*100)}</td><td class="n">${Math.round(p.ms/p.t/1000)} sn</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Soru çözdükçe her ders için doğruluk ve soru başına süre burada görünür.</div>`}</div>
  <div class="sec"><h2>Konu karnesi</h2>${topics.length?`<div class="sheet tbl-wrap"><table><thead><tr><th>Konu</th><th class="n">D/T</th><th class="n">%</th><th></th></tr></thead><tbody>${topics.map(t=>{const p=Math.round(t.c/t.t*100);return`<tr><td><b>${t.k}</b><div class="note">${DERS[t.d].ad}</div></td><td class="n">${t.c}/${t.t}</td><td class="n" style="color:${p>=70?"var(--ok)":p<45?"var(--bad)":"var(--ink)"}">${p}</td><td style="text-align:right"><button class="btn sm" onclick="A.konuTest('${t.d}','${t.k.replace(/'/g,"\\'")}')">Çöz</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">Konu karnesi ilk testinden sonra oluşur.</div>`}</div>`;
}
function netChart(){
  const h=S.denemeler.filter(x=>x.type==="tyt").slice(-12);
  if(h.length<1)return`<div class="empty">TYT mini denemesi çözdükçe toplam netin (40 üzerinden) burada çizilir.</div>`;
  const W=600,H=200,pl=34,pr=12,pt=14,pb=26;const max=40;
  const x=i=>pl+(h.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(h.length-1));const y=v=>pt+(H-pt-pb)*(1-Math.max(0,v)/max);
  const grid=[0,10,20,30,40].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
  const pts=h.map((d,i)=>`${x(i)},${y(d.net)}`).join(" ");
  const area=`${x(0)},${y(0)} ${pts} ${x(h.length-1)},${y(0)}`;
  const last=h[h.length-1];
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="TYT mini deneme net gelişimi">${grid}<polygon points="${area}" fill="var(--form)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--form)" stroke-width="2.5" stroke-linejoin="round"/>${h.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.net)}" r="${i===h.length-1?5:3}" fill="${i===h.length-1?"var(--form)":"var(--sheet)"}" stroke="var(--form)" stroke-width="2"/>`).join("")}${h.map((d,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${i+1}</text>`).join("")}</svg><div class="note">Son deneme: <b class="mono">${tr(+last.net.toFixed(2))}</b> net · tahmini TYT ham puanı <b class="mono">${tr(Math.round(last.puan))}</b></div>`;
}

/* ============ Sınav motoru ============ */
function startQuiz(qs,opt){
  if(!qs.length){toast("Bu seçimle soru bulunamadı");return}
  Z=Object.assign({qs,ans:qs.map(()=>null),elim:qs.map(()=>[]),flag:qs.map(()=>false),times:qs.map(()=>0),i:0,start:Date.now(),qStart:Date.now(),mode:"learn",limit:0,done:false,elimMode:false,showOptik:false,revealed:qs.map(()=>false)},opt);

}

  if(!Z||Z.done)return;const el=document.getElementById("qTimer");if(!el)return;
  const el2=Math.floor((Date.now()-Z.start)/1000);
  if(Z.limit){const left=Z.limit-el2;if(left<=0){finish(true);return}el.textContent=fmt(left);el.classList.toggle("warn",left<300)}

}

function bindQuiz(){}

function finish(auto){
  stamp();Z.done=true;clearInterval(Z.iv);
  const groups={};
  Z.qs.forEach((q,j)=>{
    const g=Z.groupOf?Z.groupOf[j]:DERS[q.d].ad;const G=groups[g]||(groups[g]={D:0,Y:0,B:0});
    const a=Z.ans[j];if(a===null)G.B++;else if(a===q.a)G.D++;else G.Y++;
    if(Z.mode==="test")record(q,a===q.a,Z.times[j]);
    if(Z.review)leitner(q,a===q.a);
  });
  let net=0;Object.values(groups).forEach(G=>{G.net=G.D-G.Y/4;net+=G.net});
  Z.res={groups,net,auto,dur:Math.round((Date.now()-Z.start)/1000)};
  if(Z.kind&&DENEME[Z.kind]){
    let puan=null;
    if(Z.kind==="tyt"){puan=100;Object.entries(groups).forEach(([g,G])=>{puan+=Math.max(0,G.net)*(DENEME.tyt.olcek[g]||1)*(TYT_K[g]||3.3)});puan=Math.min(500,puan)}
    Z.res.puan=puan;
    S.denemeler.push({t:Date.now(),type:Z.kind,net,n:Z.qs.length,puan,groups:Object.fromEntries(Object.entries(groups).map(([g,G])=>[g,+G.net.toFixed(2)]))});
  }
  save();render();window.scrollTo(0,0);
}
function leitner(q,ok){

  if(ok){e.box++;e.due=Date.now()+(BOX_DAYS[Math.min(e.box,5)]||30)*DAY}else{e.box=1;e.due=Date.now()+DAY}
}

   <div class="kv" style="min-width:200px"><div><b style="color:var(--ok)">${D}</b><span>doğru</span></div><div><b style="color:var(--bad)">${Y}</b><span>yanlış</span></div><div><b>${B}</b><span>boş</span></div></div>
  </div>
  ${r.puan?`<div class="sheet" style="margin-top:10px;border-color:var(--form)"><span class="eyebrow">Tahmini TYT ham puanı</span><div class="row" style="align-items:baseline"><span class="mono" style="font-size:2rem;font-weight:700">${tr(Math.round(r.puan))}</span><span class="note">netler 120 soruya ölçeklendi; yaklaşık değerdir</span></div></div>`:""}
  <div class="sheet tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Test</th><th class="n">D</th><th class="n">Y</th><th class="n">B</th><th class="n">Net</th></tr></thead><tbody>${Object.entries(r.groups).map(([g,G])=>`<tr><td>${g}</td><td class="n">${G.D}</td><td class="n">${G.Y}</td><td class="n">${G.B}</td><td class="n"><b>${tr(+G.net.toFixed(2))}</b></td></tr>`).join("")}</tbody></table><div class="note" style="margin-top:6px">Net = Doğru − Yanlış ÷ 4. Ortalama ${Math.round(r.dur/n)} sn/soru${Z.kind&&DENEME[Z.kind]?` (hedef ${Math.round(DENEME[Z.kind].sure/n)} sn)`:""}.</div></div>
  <div class="sheet" style="margin-top:10px"><div class="optik">${Z.qs.map((q,j)=>{const a=Z.ans[j];return`<a href="#r${j}" class="oc ${a===null?"r-blank":a===q.a?"r-ok":"r-bad"}" style="text-align:center;text-decoration:none" onclick="event.preventDefault();document.getElementById('r${j}').open=true;document.getElementById('r${j}').scrollIntoView({behavior:'smooth',block:'center'})">${j+1}</a>`}).join("")}</div></div>
  <div class="row" style="margin-top:12px">${Y+B?`<button class="btn pri" onclick="A.retryWrong()">Yanlış ve boşları tekrar çöz (${Y+B})</button>`:""}<button class="btn" onclick="A.go('${Z.back||"panel"}')">Bitti</button></div>
  <div class="sec"><h2>Soru soru çözümler</h2><div class="sheet">${Z.qs.map((q,j)=>{const a=Z.ans[j];const st=a===null?"blank":a===q.a?"ok":"bad";return`<details class="rev" id="r${j}" ${st!=="ok"&&j<3?"":""}><summary><span class="dot ${st}"></span><span class="mono" style="font-weight:700">${j+1}.</span><span style="flex:1;min-width:0"><b>${DERS[q.d].ad}</b><span class="note"> · ${q.k} · ${Math.round(Z.times[j]/1000)} sn</span></span><span class="mono note">${a===null?"–":LET[a]} / ${LET[q.a]}</span></summary><div class="q-text">${q.q}</div><div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?"right":k===a?"wrong":""}"><span class="bub">${LET[k]}</span><span class="otx">${o}</span></div>`).join("")}</div><div class="sol" style="margin-top:10px">${q.c}</div></details>`}).join("")}</div></div>
  </div>`;
}

/* ============ Modal ve bildirim ============ */
function modal(html,wide){document.getElementById("layer").innerHTML=`<div class="scrim" onclick="if(event.target===this)A.close()"><div class="modal${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`}
function toast(m){const l=document.createElement("div");l.className="toast";l.textContent=m;document.body.appendChild(l);setTimeout(()=>l.remove(),2200)}

/* ============ Eylemler ============ */
const A={
  go,
  ders(id){dersSel=id;render();window.scrollTo(0,0)},
  video(id,i){videoModal(MUF.find(x=>x.id===id),i)},
  konuDone(id,i){const m=MUF.find(x=>x.id===id),k=kKey(m,m.k[i]);const st=S.konu[k]||(S.konu[k]={});st.d=!st.d;save();render()},
  watched(id,i){const m=MUF.find(x=>x.id===id),k=kKey(m,m.k[i]);const st=S.konu[k]||(S.konu[k]={});st.w=!st.w;save();render();videoModal(m,i)},
  konuQ(id,i){const m=MUF.find(x=>x.id===id),k=m.k[i];startQuiz(draw({d:[m.d],k:k[2]},10),{title:`${m.ad} · ${k[0]}`,mode:"learn",back:"dersler"})},
  dersTest(id){const m=MUF.find(x=>x.id===id);startQuiz(draw({d:[m.d],s:BANK.concat(GEN).some(x=>x.d===m.d&&x.s===m.sinav)?m.sinav:null},20),{title:`${m.sinav} ${m.ad}`,mode:"learn",back:"dersler"})},
  close(){document.getElementById("layer").innerHTML=""},
  setAlan(v){S.alan=v;daily=null;save();render()},
  dailyAns(i){daily.your=i;const ok=i===daily.a;record(daily,ok,0);save();render()},
  dailyNew(){daily=null;render()},
  sf(k,v){soruF[k]=v;if(k==="d"){soruF.k="";if(!konular([v],soruF.s).length)soruF.s=""}if(k==="s")soruF.k="";render()},
  startSoru(){const f={d:[soruF.d],s:soruF.s||null,k:soruF.k||null};const qs=draw(f,soruF.n);
    startQuiz(qs,{title:`${DERS[soruF.d].ad}${soruF.k?" · "+soruF.k:""}`,mode:soruF.mode,limit:soruF.mode==="test"?Math.round(qs.length*82):0,back:"dersler"})},
  konuTest(d,k){startQuiz(draw({d:[d],k},10),{title:`${DERS[d].ad} · ${k}`,mode:"learn",back:view})},
  smart(){
    const ders=ALAN[S.alan]||ALAN.TUM;
    const tops=[];BANK.concat(GEN).forEach(x=>{if(ders.includes(x.d)&&!tops.some(t=>t.d===x.d&&t.k===x.k))tops.push({d:x.d,k:x.k})});
    const w=tops.map(t=>{const s=S.stats[t.d+"|"+t.k];return{...t,w:s?(1-(s.c+1)/(s.t+2))+0.05:0.55}});
    const used=new Set();const qs=[];
    for(let tries=0;qs.length<20&&tries<100;tries++){let tot=w.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,ch=w[0];for(const t of w){r-=t.w;if(r<=0){ch=t;break}}
      const got=draw({d:[ch.d],k:ch.k},1,used);if(got.length)qs.push(got[0]);ch.w*=0.6}
    startQuiz(qs,{title:"Akıllı Test",mode:"learn",back:"panel"})},
  review(){const d=shuf(dueList()).slice(0,30);if(!d.length){toast("Bugün tekrar bekleyen soru yok");return}
    startQuiz(d.map(e=>{const q=prep(Object.assign({},e.q,{gen:false}));q.gen=e.q.gen;return q}),{title:"Aralıklı Tekrar",mode:"learn",review:true,back:"defter"})},
  deneme(id){const D=DENEME[id];const used=new Set();const qs=[],groupOf=[];
    D.parts.forEach(p=>{draw({d:p.d,s:p.s||null},p.n,used).forEach(q=>{qs.push(q);groupOf.push(p.g)})});
    startQuiz(qs,{title:D.ad,mode:"test",limit:D.sure,kind:id,groupOf,back:"deneme"})},
  pick(j){const i=Z.i;
    if(Z.elimMode){const e=Z.elim[i];const k=e.indexOf(j);if(k>=0)e.splice(k,1);else{e.push(j);if(Z.ans[i]===j)Z.ans[i]=null}render();return}
    if(Z.elim[i].includes(j))Z.elim[i]=Z.elim[i].filter(x=>x!==j);
    Z.ans[i]=Z.ans[i]===j&&Z.mode==="test"?null:j;render()},
  check(){const i=Z.i;stamp();Z.revealed[i]=true;const q=Z.qs[i];const ok=Z.ans[i]===q.a;
    if(Z.review)leitner(q,ok);record(q,ok,Z.times[i]);save();render()},
  skip(){const i=Z.i;stamp();Z.ans[i]=null;Z.revealed[i]=true;const q=Z.qs[i];if(Z.review)leitner(q,false);record(q,false,Z.times[i]);save();render()},
  next(){if(Z.i<Z.qs.length-1){Z.i++;Z.qStart=Date.now();Z.elimMode=false;render();window.scrollTo(0,0)}else learnDone()},
  jump(j){stamp();Z.i=j;Z.elimMode=false;render();window.scrollTo(0,0)},
  flag(){Z.flag[Z.i]=!Z.flag[Z.i];render()},
  optik(){Z.showOptik=!Z.showOptik;render()},
  elimMode(){Z.elimMode=!Z.elimMode;render()},
  finishAsk(){const b=Z.ans.filter(a=>a===null).length,f=Z.flag.filter(Boolean).length;
    modal(`<h2>Sınavı bitir</h2><p>${b?`<b>${b}</b> soru boş.`:"Tüm sorular işaretli."}${f?` ${f} soruyu sonra bakmak için işaretledin.`:""} Bitirdikten sonra cevaplar değiştirilemez.</p><div class="row"><button class="btn pri" onclick="A.close();A.finishNow()">Bitir ve sonucu gör</button><button class="btn" onclick="A.close()">Devam et</button></div>`)},
  finishNow(){finish(false)},
  quit(){modal(`<h2>Çıkmak istiyor musun?</h2><p class="muted">${Z.mode==="test"?"Bu sınavın cevapları kaydedilmez.":"Kontrol ettiğin sorular kaydedildi; kalanlar kaydedilmez."}</p><div class="row"><button class="btn pri" onclick="A.close();A.quitNow()">Çık</button><button class="btn" onclick="A.close()">Devam et</button></div>`)},
  quitNow(){clearInterval(Z.iv);const b=Z.back||"panel";Z=null;go(b)},
  retryWrong(){const qs=Z.qs.filter((q,j)=>Z.ans[j]!==q.a).map(q=>prep(Object.assign({},q,{gen:false})));startQuiz(qs,{title:"Yanlışları Tekrar",mode:"learn",back:Z.back})},
  delDefter(id){delete S.defter[id];save();render()},
  goal(n){S.goal=n;save();render()},
  calc(){const g=id=>{const v=parseFloat((document.getElementById("pc_"+id)||{}).value);return isFinite(v)?v:0};
    const tur=Math.min(40,g("tur")),sos=Math.min(20,g("sos")),mat=Math.min(40,g("mat")),fen=Math.min(20,g("fen"));const dip=Math.min(100,Math.max(50,g("dip")||50));
    const ham=Math.min(500,100+tur*TYT_K["Türkçe"]+sos*TYT_K["Sosyal"]+mat*TYT_K["Matematik"]+fen*TYT_K["Fen"]);const obp=dip*5;const yer=ham+obp*0.12;
    const o=document.getElementById("calcOut");if(o)o.innerHTML=`<div class="grid3"><div class="sheet" style="padding:12px"><span class="eyebrow">Toplam net</span><div class="mono" style="font-size:1.5rem;font-weight:700">${tr(+(tur+sos+mat+fen).toFixed(2))}</div></div><div class="sheet" style="padding:12px"><span class="eyebrow">TYT ham</span><div class="mono" style="font-size:1.5rem;font-weight:700">${tr(+ham.toFixed(1))}</div></div><div class="sheet" style="padding:12px;border-color:var(--form)"><span class="eyebrow">Yerleştirme</span><div class="mono" style="font-size:1.5rem;font-weight:700">${tr(+yer.toFixed(1))}</div><div class="note">OBP ${tr(obp)} × 0,12 eklendi</div></div></div>`},
  pomo(){if(pomo.run){pomo.left=Math.max(0,Math.round((pomo.end-Date.now())/1000));pomo.run=false}else{pomo.end=Date.now()+pomo.left*1000;pomo.run=true}pomoPaint()},
  pomoReset(){pomo.run=false;pomo.phase="Odak";pomo.left=pomo.len;pomoPaint()},
  pomoLen(m){pomo.len=m*60;if(!pomo.run&&pomo.phase==="Odak")pomo.left=pomo.len;pomoPaint()},
  exportData(){const s=JSON.stringify(S);const done=()=>toast("Yedek kodu kopyalandı");
    const fallback=()=>{const b=document.getElementById("impBox");b.value=s;b.select();toast("Kod kutuya yazıldı, seçip kopyala")};
    try{navigator.clipboard.writeText(s).then(done,fallback)}catch(e){fallback()}},
  importData(){try{const v=JSON.parse(document.getElementById("impBox").value);if(!v||typeof v!=="object"||!v.stats)throw 0;S=Object.assign(fresh(),v);save();toast("Yedek yüklendi");render()}catch(e){toast("Kod okunamadı. Yedek kodunun tamamını yapıştırdığından emin ol.")}},
  resetAsk(){modal(`<h2>Tüm veriler silinsin mi?</h2><p class="muted">İstatistikler, yanlış defteri ve deneme geçmişi kalıcı olarak silinir. Önce yedek almanı öneririz.</p><div class="row"><button class="btn pri" onclick="A.close();A.resetNow()">Sil</button><button class="btn" onclick="A.close()">Vazgeç</button></div>`)},
  resetNow(){S=fresh();save();toast("Veriler silindi");render()}
};
window.A=A;
function learnDone(){stamp();Z.done=true;clearInterval(Z.iv);
  const groups={};Z.qs.forEach((q,j)=>{const g=DERS[q.d].ad;const G=groups[g]||(groups[g]={D:0,Y:0,B:0});const a=Z.ans[j];if(a===null)G.B++;else if(a===q.a)G.D++;else G.Y++});
  let net=0;Object.values(groups).forEach(G=>{G.net=G.D-G.Y/4;net+=G.net});
  Z.res={groups,net,dur:Math.round((Date.now()-Z.start)/1000)};render();window.scrollTo(0,0)}

setInterval(pomoTick,1000);
render();
</script>
