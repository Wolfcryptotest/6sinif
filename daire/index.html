<div id="lb" role="dialog" aria-label="Fotoğraf">
<img id="lbimg" alt="Daire fotoğrafı">
<button id="kapat" aria-label="Kapat">×</button>
<button id="geri" aria-label="Önceki">‹</button>
<button id="ileri" aria-label="Sonraki">›</button>
</div>
<script>
(function(){
var srcs=[].map.call(document.querySelectorAll('.ph img'),function(i){return i.getAttribute('src')});
var lb=document.getElementById('lb'),im=document.getElementById('lbimg'),n=0,x0=null;
function goster(i){n=(i+srcs.length)%srcs.length;im.src=srcs[n];lb.classList.add('on');}
function kapat(){lb.classList.remove('on');}
[].forEach.call(document.querySelectorAll('.ph'),function(b){b.addEventListener('click',function(){goster(+b.dataset.i)})});
document.getElementById('kapat').onclick=kapat;
document.getElementById('geri').onclick=function(e){e.stopPropagation();goster(n-1)};
document.getElementById('ileri').onclick=function(e){e.stopPropagation();goster(n+1)};
lb.addEventListener('click',function(e){if(e.target===lb)kapat()});
lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)goster(n+(d<0?1:-1));x0=null});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')kapat();if(e.key==='ArrowRight')goster(n+1);if(e.key==='ArrowLeft')goster(n-1)});
})();
</script>
